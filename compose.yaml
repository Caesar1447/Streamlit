services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
  # This is intentionally LOCAL ONLY. Do not publicly expose this unauthenticated demo API.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
