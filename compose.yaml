services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
  # This is intentionally LOCAL ONLY. Do not publicly expose this unauthenticated demo API.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
